<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="white" stroke-width="2">
  <!-- Kubernetes helm wheel -->
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="26"/>
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="8" fill="white" stroke="none"/>
  <circle cx="32" cy="32" r="4" fill="#1a1a2e" stroke="none"/>
  <!-- 7 spokes -->
  <line x1="32" y1="6" x2="32" y2="24"/>
  <line x1="32" y1="40" x2="32" y2="58"/>
  <line x1="6.6" y1="24.5" x2="23" y2="28.5"/>
  <line x1="41" y1="35.5" x2="57.4" y2="39.5"/>
  <line x1="10.5" y1="45" x2="25" y2="36"/>
  <line x1="39" y1="28" x2="53.5" y2="19"/>
  <line x1="53.5" y1="45" x2="39" y2="36"/>
  <line x1="25" y1="28" x2="10.5" y2="19"/>
  <!-- Spoke endpoints (small dots) -->
  <circle cx="32" cy="6" r="3" fill="white" stroke="none"/>
  <circle cx="32" cy="58" r="3" fill="white" stroke="none"/>
  <circle cx="6.6" cy="24.5" r="3" fill="white" stroke="none"/>
  <circle cx="57.4" cy="39.5" r="3" fill="white" stroke="none"/>
  <circle cx="10.5" cy="45" r="3" fill="white" stroke="none"/>
  <circle cx="53.5" cy="19" r="3" fill="white" stroke="none"/>
  <circle cx="53.5" cy="45" r="3" fill="white" stroke="none"/>
  <circle cx="10.5" cy="19" r="3" fill="white" stroke="none"/>
</svg>