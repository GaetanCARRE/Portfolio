<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="white">
  <!-- Juniper Networks - three-pointed star/asterisk -->
  <!-- Center -->
  <circle cx="32" cy="32" r="4"/>
  <!-- 6 branches radiating out -->
  <rect x="30" y="4" width="4" height="20" rx="2"/>
  <rect x="30" y="40" width="4" height="20" rx="2"/>
  <rect x="30" y="4" width="4" height="20" rx="2" transform="rotate(60 32 32)"/>
  <rect x="30" y="40" width="4" height="20" rx="2" transform="rotate(60 32 32)"/>
  <rect x="30" y="4" width="4" height="20" rx="2" transform="rotate(-60 32 32)"/>
  <rect x="30" y="40" width="4" height="20" rx="2" transform="rotate(-60 32 32)"/>
  <!-- Endpoint dots -->
  <circle cx="32" cy="4" r="3"/>
  <circle cx="32" cy="60" r="3"/>
  <circle cx="7.7" cy="18" r="3"/>
  <circle cx="56.3" cy="46" r="3"/>
  <circle cx="7.7" cy="46" r="3"/>
  <circle cx="56.3" cy="18" r="3"/>
</svg>