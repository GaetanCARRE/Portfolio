<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="white">
  <!-- Go gopher simplified -->
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="16" ry="18"/>
  <!-- Head -->
  <circle cx="32" cy="18" r="12"/>
  <!-- Left eye -->
  <circle cx="27" cy="16" r="4" fill="#1a1a2e"/>
  <circle cx="27" cy="16" r="2" fill="white"/>
  <circle cx="28" cy="15" r="1" fill="#1a1a2e"/>
  <!-- Right eye -->
  <circle cx="37" cy="16" r="4" fill="#1a1a2e"/>
  <circle cx="37" cy="16" r="2" fill="white"/>
  <circle cx="38" cy="15" r="1" fill="#1a1a2e"/>
  <!-- Nose / mouth -->
  <ellipse cx="32" cy="22" rx="3" ry="1.5" fill="#1a1a2e" opacity="0.3"/>
  <!-- Left ear -->
  <ellipse cx="22" cy="10" rx="3" ry="5" transform="rotate(-15 22 10)"/>
  <!-- Right ear -->
  <ellipse cx="42" cy="10" rx="3" ry="5" transform="rotate(15 42 10)"/>
  <!-- Left arm -->
  <rect x="12" y="32" width="5" height="14" rx="2.5"/>
  <!-- Right arm -->
  <rect x="47" y="32" width="5" height="14" rx="2.5"/>
  <!-- Left foot -->
  <ellipse cx="26" cy="56" rx="5" ry="3"/>
  <!-- Right foot -->
  <ellipse cx="38" cy="56" rx="5" ry="3"/>
  <!-- Tummy -->
  <ellipse cx="32" cy="40" rx="10" ry="12" fill="#1a1a2e" opacity="0.15"/>
</svg>
